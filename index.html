<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrays, DOM e Eventos – Semana 04</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    li { cursor: pointer; margin: .25rem 0; }
    .destaque { color: #b45309; font-weight: bold; }
    .feito { text-decoration: line-through; color: #6b7280; }
    form, button, input { margin: .5rem .5rem .5rem 0; }
  </style>
</head>
<body>
  <h1 id="titulo">Título</h1>
  <p class="texto">Primeiro parágrafo.</p>
  <p class="texto">Segundo parágrafo.</p>

  <button id="botao">Clique aqui</button>
  <input id="nome" type="text" placeholder="Digite seu nome">

  <ul id="lista">
    <li>Item do HTML 1</li>
    <li>Item do HTML 2</li>
    <li>Item do HTML 3</li>
  </ul>

  <form id="formulario">
    <input id="tarefa" type="text" placeholder="Nova tarefa">
    <button type="submit">Adicionar</button>
  </form>

  <script src="app.js" defer></script>
</body>
</html>
